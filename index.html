<!DOCTYPE html>
<html>
<head>
  <base href="/GIMP_APP_WEB/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Grimpp Platform - Secure Application">
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="grimpplataform">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Grimpp Platform</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Estilo Oscuro Moderno */
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --accent: #007acc;
      --accent-hover: #005999;
      --border: #333333;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
    }

    /* Preloader con estilo oscuro */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--text-secondary);
      font-size: 14px;
      text-align: center;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Warning overlay - solo en producción */
    #warning-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      backdrop-filter: blur(10px);
    }

    .warning-content {
      background: var(--bg-secondary);
      border: 2px solid #ff4444;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 20px 40px var(--shadow);
    }

    .warning-icon {
      font-size: 48px;
      color: #ff4444;
      margin-bottom: 20px;
    }

    .warning-title {
      font-size: 24px;
      color: #ff4444;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .warning-message {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* App container */
    #app-container {
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #app-container.loaded {
      opacity: 1;
    }

    /* Modern dark theme para Flutter */
    flt-glass-pane {
      background: transparent !important;
    }

    /* Estilos para producción */
    .production-mode body {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .warning-content {
        margin: 20px;
        padding: 30px 20px;
      }

      .warning-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
<!-- Loading Overlay -->
<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">
    Cargando Grimpp Platform...<br>
    <small>Iniciando aplicación</small>
  </div>
</div>

<!-- Warning Overlay (solo producción) -->
<div id="warning-overlay">
  <div class="warning-content">
    <div class="warning-icon">⚠️</div>
    <div class="warning-title">Acceso Denegado</div>
    <div class="warning-message">
      Se ha detectado el uso de herramientas de desarrollador.<br>
      Esta aplicación está protegida contra inspección no autorizada.<br>
      <strong>Cierre las herramientas de desarrollador para continuar.</strong>
    </div>
  </div>
</div>

<!-- App Container -->
<div id="app-container">
  <!-- Flutter app se carga aquí -->
</div>

<script>
  (function() {
    'use strict';

    // Detectar modo de desarrollo
    const isDevelopment = window.location.hostname === 'localhost' ||
                         window.location.hostname === '127.0.0.1' ||
                         window.location.port !== '' ||
                         window.location.protocol === 'file:';

    console.log('%cGrimpp Platform', 'color: #007acc; font-size: 20px; font-weight: bold;');
    console.log(`%cModo: ${isDevelopment ? 'Desarrollo' : 'Producción'}`,
                `color: ${isDevelopment ? '#4CAF50' : '#ff9800'}; font-weight: bold;`);

    // Variables de control
    let loadingComplete = false;
    const loadingOverlay = document.getElementById('loading-overlay');
    const warningOverlay = document.getElementById('warning-overlay');
    const appContainer = document.getElementById('app-container');

    // Solo aplicar seguridad en producción
    if (!isDevelopment) {
      document.body.classList.add('production-mode');

      // Desactivar clic derecho solo en producción
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        showSecurityWarning();
        return false;
      });

      // Desactivar shortcuts peligrosos solo en producción
      document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123 ||
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
            (e.ctrlKey && e.keyCode === 85)) {
          e.preventDefault();
          showSecurityWarning();
          return false;
        }
      });

      // Detectar DevTools solo en producción
      let devToolsCheckInterval = setInterval(function() {
        if (!loadingComplete) return;

        const widthThreshold = window.outerWidth - window.innerWidth > 160;
        const heightThreshold = window.outerHeight - window.innerHeight > 160;

        if (widthThreshold || heightThreshold) {
          showSecurityWarning();
        }
      }, 2000); // Menos frecuente para no interferir

      // Función para mostrar advertencia de seguridad
      function showSecurityWarning() {
        warningOverlay.style.display = 'flex';
        appContainer.style.display = 'none';
      }

      // Función para ocultar advertencia
      function hideSecurityWarning() {
        warningOverlay.style.display = 'none';
        appContainer.style.display = 'block';
      }

      // Limpiar consola en producción
      setInterval(function() {
        if (loadingComplete) {
          console.clear();
          console.log('%cAcceso Restringido', 'color: #ff4444; font-size: 16px; font-weight: bold;');
          console.log('%cEsta aplicación está protegida.', 'color: #ff4444;');
        }
      }, 5000);
    }

    // Función para cargar Flutter
    function initializeFlutter() {
      // Ocultar loading después de un breve delay
      setTimeout(function() {
        loadingOverlay.style.opacity = '0';

        setTimeout(function() {
          loadingOverlay.style.display = 'none';
          appContainer.classList.add('loaded');
          loadingComplete = true;

          console.log('%cAplicación lista', 'color: #4CAF50; font-weight: bold;');
        }, 500);
      }, 1500);
    }

    // Cargar Flutter script
    function loadFlutterScript() {
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;

      script.onload = function() {
        console.log('%cFlutter bootstrap cargado', 'color: #007acc;');
        initializeFlutter();
      };

      script.onerror = function() {
        console.error('%cError cargando Flutter', 'color: #ff4444; font-weight: bold;');

        // Mostrar error en la interfaz
        loadingOverlay.innerHTML = `
          <div style="color: #ff4444; text-align: center;">
            <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
            <div style="font-size: 18px; margin-bottom: 10px;">Error al cargar la aplicación</div>
            <div style="font-size: 14px; opacity: 0.7;">Intente recargar la página</div>
            <button onclick="window.location.reload()"
                    style="margin-top: 20px; padding: 10px 20px; background: #007acc; color: white; border: none; border-radius: 6px; cursor: pointer;">
              Recargar
            </button>
          </div>
        `;
      };

      document.body.appendChild(script);
    }

    // Inicializar cuando el DOM esté listo
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadFlutterScript);
    } else {
      loadFlutterScript();
    }

    // Manejo de visibilidad de página
    document.addEventListener('visibilitychange', function() {
      if (document.hidden && !isDevelopment) {
        console.log('Aplicación en segundo plano');
      } else if (!document.hidden) {
        console.log('Aplicación activa');
      }
    });

  })();
</script>

</body>
</html>
