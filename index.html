<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Grimpp Platform - Secure Application">
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="grimpplataform">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Grimpp Platform</title>
  <link rel="manifest" href="manifest.json">

  <!-- Security Headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">

  <style>
    /* Estilo Oscuro Moderno */
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --accent: #007acc;
      --accent-hover: #005999;
      --border: #333333;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Preloader con estilo oscuro */
    #security-check {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .security-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .security-text {
      color: var(--text-secondary);
      font-size: 14px;
      text-align: center;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Warning overlay */
    #warning-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      backdrop-filter: blur(10px);
    }

    .warning-content {
      background: var(--bg-secondary);
      border: 2px solid #ff4444;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 20px 40px var(--shadow);
    }

    .warning-icon {
      font-size: 48px;
      color: #ff4444;
      margin-bottom: 20px;
    }

    .warning-title {
      font-size: 24px;
      color: #ff4444;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .warning-message {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* App container */
    #app-container {
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #app-container.loaded {
      opacity: 1;
    }

    /* Anti-debug styles */
    .no-devtools {
      position: absolute;
      left: -9999px;
      top: -9999px;
      visibility: hidden;
    }

    /* Modern dark theme for Flutter content */
    flt-glass-pane {
      background: transparent !important;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .warning-content {
        margin: 20px;
        padding: 30px 20px;
      }

      .warning-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
<!-- Security Check Overlay -->
<div id="security-check">
  <div class="security-spinner"></div>
  <div class="security-text">
    Verificando seguridad...<br>
    <small>Grimpp Platform</small>
  </div>
</div>

<!-- Warning Overlay -->
<div id="warning-overlay">
  <div class="warning-content">
    <div class="warning-icon">⚠️</div>
    <div class="warning-title">Acceso Denegado</div>
    <div class="warning-message">
      Se ha detectado el uso de herramientas de desarrollador.<br>
      Esta aplicación está protegida contra inspección no autorizada.<br>
      <strong>Cierre las herramientas de desarrollador para continuar.</strong>
    </div>
  </div>
</div>

<!-- App Container -->
<div id="app-container">
  <!-- Flutter app will be injected here -->
</div>

<!-- Security Scripts -->
<script>
  (function() {
    'use strict';

    // Variables de seguridad
    let devToolsOpen = false;
    let warningShown = false;
    let securityCheckPassed = false;

    // Elementos del DOM
    const securityCheck = document.getElementById('security-check');
    const warningOverlay = document.getElementById('warning-overlay');
    const appContainer = document.getElementById('app-container');

    // Desactivar clic derecho
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      showDevToolsWarning();
      return false;
    });

    // Desactivar shortcuts de teclado peligrosos
    document.addEventListener('keydown', function(e) {
      // F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+Shift+C
      if (e.keyCode === 123 ||
          (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
          (e.ctrlKey && e.keyCode === 85)) {
        e.preventDefault();
        e.stopPropagation();
        showDevToolsWarning();
        return false;
      }

      // Desactivar Ctrl+A, Ctrl+S, Ctrl+P
      if (e.ctrlKey && (e.keyCode === 65 || e.keyCode === 83 || e.keyCode === 80)) {
        e.preventDefault();
        return false;
      }
    });

    // Detectar DevTools por tamaño de ventana
    function detectDevToolsBySize() {
      const widthThreshold = window.outerWidth - window.innerWidth > 160;
      const heightThreshold = window.outerHeight - window.innerHeight > 160;

      if (widthThreshold || heightThreshold) {
        if (!devToolsOpen) {
          devToolsOpen = true;
          showDevToolsWarning();
        }
      } else {
        if (devToolsOpen) {
          devToolsOpen = false;
          hideDevToolsWarning();
        }
      }
    }

    // Detectar DevTools por console.log
    function detectDevToolsByConsole() {
      const element = new Image();
      let devToolsDetected = false;

      Object.defineProperty(element, 'id', {
        get: function() {
          devToolsDetected = true;
          showDevToolsWarning();
          throw new Error('DevTools detected');
        }
      });

      setTimeout(() => {
        try {
          console.log(element);
          console.clear();
        } catch (e) {
          // DevTools detected
        }
      }, 100);
    }

    // Detectar debugger
    function detectDebugger() {
      setInterval(function() {
        const start = new Date().getTime();
        debugger;
        const end = new Date().getTime();

        if (end - start > 100) {
          showDevToolsWarning();
        }
      }, 1000);
    }

    // Mostrar advertencia de DevTools
    function showDevToolsWarning() {
      if (!warningShown) {
        warningShown = true;
        warningOverlay.style.display = 'flex';
        appContainer.style.display = 'none';

        // Intentar cerrar la ventana
        setTimeout(() => {
          try {
            window.close();
          } catch (e) {
            // No se puede cerrar
          }
        }, 3000);
      }
    }

    // Ocultar advertencia de DevTools
    function hideDevToolsWarning() {
      if (warningShown) {
        warningShown = false;
        warningOverlay.style.display = 'none';
        appContainer.style.display = 'block';
      }
    }

    // Protección contra selección de texto
    document.onselectstart = function() {
      return false;
    };

    // Protección contra arrastrar
    document.ondragstart = function() {
      return false;
    };

    // Detectar focus/blur para detectar DevTools
    let focusTime = Date.now();

    window.addEventListener('focus', function() {
      focusTime = Date.now();
    });

    window.addEventListener('blur', function() {
      if (Date.now() - focusTime < 500) {
        showDevToolsWarning();
      }
    });

    // Monitoreo continuo
    setInterval(detectDevToolsBySize, 500);
    setInterval(detectDevToolsByConsole, 2000);

    // Inicializar detectores
    detectDebugger();

    // Limpiar consola constantemente
    setInterval(function() {
      console.clear();
      console.log('%cAcceso Denegado', 'color: #ff4444; font-size: 30px; font-weight: bold;');
      console.log('%cEsta aplicación está protegida contra inspección.', 'color: #ff4444; font-size: 14px;');
    }, 1000);

    // Simulación de verificación de seguridad
    setTimeout(function() {
      securityCheckPassed = true;
      securityCheck.style.opacity = '0';

      setTimeout(function() {
        securityCheck.style.display = 'none';
        appContainer.classList.add('loaded');
      }, 500);
    }, 2000);

    // Protección contra modificación del DOM
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.type === 'childList') {
          // Verificar si se agregaron elementos sospechosos
          mutation.addedNodes.forEach(function(node) {
            if (node.nodeType === 1) { // Element node
              if (node.tagName === 'SCRIPT' || node.tagName === 'STYLE') {
                if (!node.hasAttribute('data-flutter-authorized')) {
                  node.remove();
                }
              }
            }
          });
        }
      });
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });

    // Prevenir iframe injection
    window.addEventListener('beforeunload', function(e) {
      if (window.top !== window.self) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // Anti-XSS básico y protección service worker
    window.addEventListener('message', function(e) {
      // Solo aceptar mensajes de origen confiable
      if (e.origin !== window.location.origin) {
        return;
      }

      // Verificar mensajes de Flutter
      if (e.data && e.data.type === 'flutter-initialized') {
        console.log('%cFlutter inicializado de forma segura', 'color: #007acc;');
      }
    });

    // Protección adicional para Flutter
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            if (!registration.scope.includes(window.location.origin)) {
              registration.unregister();
            }
          });
        });
      });
    }

  })();

  // Cargar script de Flutter de forma segura
  function loadFlutterScript() {
    const script = document.createElement('script');
    script.src = 'flutter_bootstrap.js';
    script.async = true;
    script.setAttribute('data-flutter-authorized', 'true');

    script.onload = function() {
      console.log('%cFlutter cargado correctamente', 'color: #007acc; font-weight: bold;');

      // Inicializar Flutter cuando esté listo
      if (window._flutter && window._flutter.loader) {
        window._flutter.loader.load({
          serviceWorkerSettings: {
            serviceWorkerVersion: null,
          },
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              appRunner.runApp();
            });
          }
        });
      }
    };

    script.onerror = function() {
      console.error('%cError cargando Flutter', 'color: #ff4444; font-weight: bold;');
      // Mostrar mensaje de error al usuario
      securityCheck.innerHTML = `
        <div style="color: #ff4444; text-align: center;">
          <div style="font-size: 24px; margin-bottom: 10px;">⚠️</div>
          <div>Error cargando la aplicación</div>
          <div style="font-size: 12px; margin-top: 10px;">Intente recargar la página</div>
        </div>
      `;
    };

    document.body.appendChild(script);
  }

  // Cargar Flutter después de las verificaciones de seguridad
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadFlutterScript);
  } else {
    loadFlutterScript();
  }

</script>

<!-- Elemento trampa para detectores -->
<div class="no-devtools">
  <script>
    console.log('Security check active');
  </script>
</div>

</body>
</html>
